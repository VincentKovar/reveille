# Publishes the web app (www/) to GitHub Pages on every push to main.
# This is the iPhone / browser version. One-time setup: repo Settings → Pages →
# Source: "GitHub Actions".
name: Publish web app

on:
  push:
    branches: [main]
    paths: ["www/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
