# Builds an installable Android APK (public edition, debug-signed) on every push,
# so anyone who forks this repo can get their own build without installing
# Java or the Android SDK. Download it from the run's "Artifacts" section.
name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners come with the Android SDK preinstalled (ANDROID_HOME is set).
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - run: ./gradlew assemblePortfolioDebug --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: Reveille-android
          path: android/app/build/outputs/apk/portfolio/debug/app-portfolio-debug.apk
